# Featured personal projects, rendered as large cards on the homepage.
# Every claim here is verifiable against the linked repository's README/source.
featured:
  - slug: climbing-regulations-rag
    title: "Climbing Regulations RAG"
    kicker: "Retrieval-augmented generation"
    summary: >-
      A question-answering system over federal climbing regulations from the
      Forest Service, BLM, National Park Service, and Fish &amp; Wildlife Service.
      Ask it "how many fixed anchors can I place without a permit?" and it
      answers with real citations to the actual rule text.
    body: >-
      The interesting engineering problem here is not "can a model answer a
      question" — it is making it structurally impossible for the model to cite
      a rule that does not exist. Retrieved passages are labeled with
      placeholder IDs before the model ever sees them, the model is instructed
      to cite only those placeholders, and a separate post-processing step swaps
      each placeholder for the real citation. An unmapped placeholder is a hard
      error, not a guess.
    visual: climbing-rag
    highlights:
      - "Chunks split on real regulatory structure (title / part / section / paragraph) so every chunk maps to one citable rule, never two"
      - "Hybrid retrieval — dense embeddings plus Postgres keyword search, combined and reranked through Bedrock"
      - "Placeholder-based citation pipeline: 100% valid citations across 86 generated answers, and it declined all 5 deliberately unanswerable questions"
      - "43-question eval harness (18 hand-written, 25 generated) comparing four retrieval strategies; each run tagged with the corpus version it saw"
      - "Deployed as a FastAPI Lambda container with RDS Postgres + pgvector via AWS CDK — no NAT gateway, ~$0.13 for the live demo window"
    tech:
      - Python
      - AWS Bedrock
      - AWS CDK
      - Lambda
      - RDS
      - Postgres / pgvector
      - FastAPI
      - Docker
    links:
      - label: "View source"
        url: "https://github.com/pdegner/climbing-regulations-rag"
        primary: true
      - label: "Read the write-up"
        url: "https://github.com/pdegner/climbing-regulations-rag#readme"

  - slug: notes-mcp
    title: "notes-mcp"
    kicker: "Model Context Protocol server"
    summary: >-
      A Python MCP server that gives Claude Code and Claude Desktop persistent,
      local note-taking. Notes are plain Markdown files on your own machine,
      addressed by a stable numeric id — so a note you reference often always
      lives at the same address, the way a sticky note stays put on your desk.
    body: >-
      It uses all three MCP primitives deliberately, because they do different
      jobs: tools are verbs the model chooses to call, resources are nouns the
      client can pull into context by URI, and prompts are templates the user
      invokes on purpose. The design notes in the README cover the parts that
      actually matter in an agent tool — bounding context, validating
      model-supplied input before it touches the filesystem, and keeping stdout
      clean on the stdio transport.
    visual: notes-mcp
    highlights:
      - "Five tools, three resources (including a <code>note://{id}</code> template), and a summarize prompt"
      - "List and search return metadata plus a snippet, never full bodies, so a large notes directory can't flood the model's context"
      - "Note ids arrive from a model, so every id is pattern-validated before it becomes a path; writes are atomic temp-file renames"
      - "Notes live outside the repo in <code>~/.notes-mcp/</code> with 0700/0600 permissions — git never sees them"
      - "58 tests plus ruff lint and format checks, run in CI against Python 3.10 and 3.12"
    tech:
      - Python
      - MCP
      - uv
      - pytest
      - ruff
      - GitHub Actions
    links:
      - label: "View source"
        url: "https://github.com/pdegner/notes-mcp"
        primary: true
      - label: "Read the write-up"
        url: "https://github.com/pdegner/notes-mcp#readme"

