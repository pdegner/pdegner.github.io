---
layout: base
---
<article class="page">
  <div class="wrap wrap--narrow">
    <header class="page__header">
      {%- if page.kicker %}<p class="eyebrow">{{ page.kicker }}</p>{% endif %}
      <h1 class="page__title">{{ page.title }}</h1>
      {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
