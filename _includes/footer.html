<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__note">
      Built with Jekyll, hosted on GitHub Pages.
      <a href="https://github.com/pdegner/pdegner.github.io">Source for this site</a>.
    </p>
    <ul class="site-footer__links">
      <li><a href="{{ site.profile.github }}">GitHub</a></li>
      <li><a href="{{ site.profile.linkedin }}">LinkedIn</a></li>
      <li><a href="mailto:{{ site.profile.email }}">Email</a></li>
      {%- if site.profile.resume %}
      <li><a href="{{ site.profile.resume | relative_url }}">Résumé (PDF)</a></li>
      {%- endif %}
    </ul>
  </div>
</footer>
